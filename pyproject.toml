[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "herrkirkjo-ragret_jd013"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告RAG 检索工程师·MoE 路由的负载不均相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "herrkirkjo" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://herrkirkjo.github.io"
Repository = "https://github.com/herrkirkjo/ragret_jd013"
Issues = "https://github.com/herrkirkjo/ragret_jd013/issues"

[project.scripts]
ragret_jd013 = "ragret_jd013:main"

[tool.setuptools]
py-modules = ["ragret_jd013"]
